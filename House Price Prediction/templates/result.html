<!DOCTYPE html>
<html>
<head>
    <title>HousePriceAI</title>
    
<style>
body {
    margin: 0;
    font-family: 'Roboto', Arial, sans-serif;
    background-color: #ECECEC;
}

/* ================= NAVIGATION ================= */
nav {
    background-color: #0A2A66;
    padding: 15px 30px;
}

.nav-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 42px;
    height: 42px;
}

.logo span {
    color: #FFFFFF;
    font-size: 22px;
    font-weight: bold;
}

nav a {
    color: #FFFFFF;
    margin-left: 20px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
}

nav a:hover {
    color: #4DA3FF;
}

/* ================= FORM ================= */
.form-container {
    width: 550px;
    margin: 50px auto;
    background: #FFFFFF;
    padding: 30px;
    border-radius: 12px;
    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.15),
        0 4px 10px rgba(30, 144, 255, 0.15);
    border-left: 4px solid #1E90FF;
}

.form-container h2 {
    text-align: center;
    color: #0A2A66;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}

.form-group input,
.form-group select {
    width: 100%;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.predict-btn {
    width: 100%;
    padding: 10px;
    background-color: #1E90FF;
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.predict-btn:hover {
    background-color: #166FCC;
}


</style>
</head>
<body>
<!-- ================= NAV ================= -->
<nav>
    <div class="nav-container">
        <div class="logo">
            <span>HousePriceAI</span>
        </div>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('how_it_works') }}">How It Works</a>
            <a href="{{ url_for('faq') }}">FAQ</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>
</nav>

    <h2>Predicted House Price</h2>
    <h1>₹ {{ predicted_price }}</h1>

    <a href="{{ url_for('how_it_works') }}">Back to Page again</a>

</body>
</html>
