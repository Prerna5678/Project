<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us</title>
<style>
*, *::before, *::after { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Roboto', Arial, sans-serif;
    background-color: #ECECEC;
}

/* ================= NAVIGATION ================= */
nav {
    background-color: #0A2A66;
    padding: 15px 30px;
}

.nav-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img { width: 42px; height: 42px; }

.logo span {
    color: #FFFFFF;
    font-size: 22px;
    font-weight: bold;
}

nav a {
    color: #FFFFFF;
    margin-left: 20px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
}

nav a:hover { color: #4DA3FF; }

/* ================= PAGE WRAPPER ================= */
.page-wrapper {
    max-width: 1100px;
    margin: 50px auto 60px;
    padding: 0 20px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 30px;
    max-width: 750px;
}

/* ================= CARDS ================= */
.card {
    background: #FFFFFF;
    border-radius: 12px;
    padding: 34px 36px;
    box-shadow:
        0 10px 25px rgba(0,0,0,0.12),
        0 4px 10px rgba(30,144,255,0.12);
    border-left: 4px solid #1E90FF;
}

.card h2 {
    color: #0A2A66;
    margin: 0 0 6px;
    font-size: 20px;
}

.card .subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 22px;
}

/* ================= FLASH MESSAGES ================= */
.flash-success {
    background: #e6f9f0;
    color: #15803d;
    border: 1px solid #86efac;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13.5px;
}

.flash-error {
    background: #fef2f2;
    color: #b91c1c;
    border: 1px solid #fca5a5;
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13.5px;
}

/* ================= CONTACT FORM ================= */
.form-group {
    margin-bottom: 14px;
}

.form-group label {
    display: block;
    font-weight: bold;
    color: #333;
    margin-bottom: 5px;
    font-size: 13.5px;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 9px 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
    resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: #1E90FF;
    box-shadow: 0 0 0 2px rgba(30,144,255,0.12);
}

.submit-btn {
    width: 100%;
    padding: 11px;
    background-color: #1E90FF;
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 6px;
    transition: background-color 0.2s;
}

.submit-btn:hover { background-color: #166FCC; }

/* ================= INFO PANEL ================= */
.info-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 18px;
}

.info-icon {
    width: 38px;
    height: 38px;
    background: #eef3ff;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
}

.info-text strong {
    display: block;
    color: #0A2A66;
    font-size: 13.5px;
    margin-bottom: 2px;
}

.info-text span {
    color: #555;
    font-size: 13px;
    line-height: 1.5;
}

.divider {
    border: none;
    border-top: 1px solid #e5e7eb;
    margin: 20px 0;
}

.social-row {
    display: flex;
    gap: 12px;
    margin-top: 6px;
}

.social-row a img {
    width: 30px;
    height: 30px;
    border-radius: 6px;
    transition: opacity 0.2s;
}

.social-row a:hover img { opacity: 0.75; }

/* ================= AI CHATBOT ================= */
.chatbot-card {
    grid-column: 1 / -1;   /* full width */
}

.chat-window {
    height: 340px;
    overflow-y: auto;
    border-radius: 8px;
    padding: 14px;
    background: #f7faff;
    margin-bottom: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13.5px;
    line-height: 1.55;
    word-wrap: break-word;
}

.msg.user {
    background: #1E90FF;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 3px;
}

.msg.bot {
    background: #FFFFFF;
    color: #222;
    align-self: flex-start;
    border-bottom-left-radius: 3px;
}

.msg.bot.thinking {
    color: #888;
    font-style: italic;
}

.chat-input-row {
    display: flex;
    gap: 10px;
}

.chat-input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
}

.chat-input-row input:focus {
    outline: none;
    border-color: #1E90FF;
    box-shadow: 0 0 0 2px rgba(30,144,255,0.12);
}

.chat-send-btn {
    padding: 10px 22px;
    background-color: #1E90FF;
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: background-color 0.2s;
    white-space: nowrap;
}

.chat-send-btn:hover { background-color: #166FCC; }
.chat-send-btn:disabled { background-color: #aaa; cursor: not-allowed; }

/* ================= FOOTER ================= */
.footer {
    background-color: #0A2A66;
    padding: 50px 60px;
    color: #F1F5FF;
    margin-top: 20px;
}

.footer-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 35px;
}

.footer h4 {
    color: #FFFFFF;
    margin-bottom: 18px;
    font-size: 18px;
}

.footer p {
    margin: 6px 0;
    font-size: 15px;
    line-height: 1.7;
    color: #F1F5FF;
}

.footer a {
    display: block;
    color: #D6E0F5;
    text-decoration: none;
    margin-bottom: 10px;
    font-size: 15px;
}

.footer a:hover { color: #4DA3FF; }

.social-icons { display: flex; gap: 15px; }

.social-icons img {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
}

.footer-bottom {
    background-color: #081F4D;
    color: #FFFFFF;
    text-align: center;
    padding: 12px;
    font-size: 14px;
}
</style>
</head>
<body>

<!-- ================= NAV ================= -->
<nav>
    <div class="nav-container">
        <div class="logo">
            <span>HomePriceAI</span>
        </div>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('property_page') }}">Property</a>
            <a href="{{ url_for('how_it_works') }}">How It Works</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>
</nav>

<!-- ================= MAIN CONTENT ================= -->
<div class="page-wrapper">

    <!-- LEFT: Contact Form -->
    <div class="card">
        <h2>📬 Send Us a Message</h2>
        <p class="subtitle">We usually respond within 24 hours.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('contact') }}">
            <div class="form-group">
                <label>Your Name</label>
                <input type="text" name="name" placeholder="e.g. Rahul Sharma" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" name="subject" placeholder="e.g. Pricing query" required>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea name="message" rows="5" placeholder="Write your message here..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">📨 Send Message</button>
        </form>
    </div>

</div>

</body>
</html>
