<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign Up</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin:0; font-family:'Roboto',Arial,sans-serif; background:#ECECEC; }
nav { background:#0A2A66; padding:15px 30px; }
.nav-container { display:flex; align-items:center; justify-content:space-between; }
.logo { display:flex; align-items:center; gap:10px; }
.logo img { width:42px; height:42px; }
.logo span { color:#fff; font-size:22px; font-weight:bold; }
nav a { color:#fff; margin-left:20px; text-decoration:none; font-size:16px; font-weight:bold; }
nav a:hover { color:#4DA3FF; }
.signup-section { display:flex; justify-content:center; align-items:center; padding:60px 20px; }
.form-container {
    width:420px; background:#fff; padding:35px; border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15),0 4px 10px rgba(30,144,255,0.15);
    border-top:5px solid #1E90FF;
}
.form-container h2 { text-align:center; color:#0A2A66; margin-bottom:25px; }
.form-group { margin-bottom:18px; }
.form-group label { font-weight:bold; display:block; margin-bottom:6px; color:#333; }
.form-group input {
    width:100%; padding:10px; border-radius:6px;
    border:1px solid #ccc; font-size:14px; transition:border 0.3s;
}
.form-group input:focus { border:1px solid #1E90FF; outline:none; }
.signup-btn {
    width:100%; padding:12px; background:#1E90FF; color:#fff;
    border:none; border-radius:6px; font-size:16px; font-weight:bold;
    cursor:pointer; transition:background 0.3s;
}
.signup-btn:hover { background:#166FCC; }
.form-footer { text-align:center; margin-top:15px; font-size:14px; }
.form-footer a { color:#1E90FF; text-decoration:none; font-weight:bold; }
.toast {
    position:fixed; top:24px; left:50%;
    transform:translateX(-50%) translateY(-20px);
    background:#fff; border-radius:10px; padding:14px 24px 14px 18px;
    box-shadow:0 8px 30px rgba(0,0,0,0.15);
    display:flex; align-items:center; gap:12px;
    font-size:15px; font-weight:600; z-index:9999;
    opacity:0; transition:opacity 0.35s, transform 0.35s;
    min-width:300px; max-width:480px; pointer-events:none;
}
.toast.success { border-left:4px solid #16a34a; color:#15803d; background:#f0fdf4; }
.toast.error   { border-left:4px solid #dc2626; color:#b91c1c; background:#fef2f2; }
.toast.show    { opacity:1; transform:translateX(-50%) translateY(0); }
.footer { background:#0A2A66; padding:50px 60px; color:#F1F5FF; margin-top:40px; }
.footer-container { display:grid; grid-template-columns:repeat(4,1fr); gap:35px; }
.footer h4 { color:#fff; margin-bottom:18px; font-size:18px; }
.footer p  { margin:6px 0; font-size:15px; line-height:1.7; color:#F1F5FF; }
.footer a  { display:block; color:#D6E0F5; text-decoration:none; margin-bottom:10px; font-size:15px; }
.footer a:hover { color:#4DA3FF; }
.social-icons { display:flex; gap:15px; }
.social-icons img { width:28px; height:28px; border-radius:6px; }
.footer-bottom { background:#081F4D; color:#fff; text-align:center; padding:12px; font-size:14px; }
</style>
</head>
<body>

<nav>
    <div class="nav-container">
        <div class="logo">
            <span>HomePriceAI</span>
        </div>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('property_page') }}">Property</a>
            <a href="{{ url_for('how_it_works') }}">How It Works</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>
</nav>

<section class="signup-section">
    <div class="form-container">
        <h2>Create Account</h2>
        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="name" placeholder="Enter your username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>Email (optional)</label>
                <input type="email" name="email" placeholder="Enter your email address" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password" autocomplete="new-password" required>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" placeholder="Re-enter your password" autocomplete="new-password" required>
            </div>
            <button type="submit" class="signup-btn">Sign Up</button>
        </form>
        <div class="form-footer">
            Already have an account? <a href="{{ url_for('login') }}">Sign In</a>
        </div>
    </div>
</section>

<div class="toast" id="toast">
    <span id="toast-icon"></span>
    <span id="toast-msg"></span>
</div>

<script>
function showToast(message, type) {
    var toast = document.getElementById('toast');
    toast.className = 'toast ' + type + ' show';
    document.getElementById('toast-icon').textContent = (type === 'success') ? 'OK' : 'Error';
    document.getElementById('toast-msg').textContent = message;
    setTimeout(function() { toast.classList.remove('show'); }, 4000);
}
</script>

{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
<script>
window.addEventListener('DOMContentLoaded', function() {
    showToast({{ message|tojson }}, {{ category|tojson }});
});
</script>
{% endfor %}
{% endwith %}

</body>
</html>
