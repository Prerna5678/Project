<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body>

    <div class="container">

        <h2>💰 Personal Expense Tracker</h2><br>

        <div class="form-card">
            <h3>Add New Expense</h3>

            <form action="/add" method="POST">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div><br>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select Category</option>
                        <option>Food</option>
                        <option>Transport</option>
                        <option>Shopping</option>
                        <option>Bills</option>
                        <option>Entertainment</option>
                        <option>Other</option>
                    </select>
                </div><br>

                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" name="amount" placeholder="Enter amount" required>
                </div><br>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" placeholder="Enter description" required>
                </div><br>

                <button type="submit" name="action" value="add">➕ Add Expense</button><br><br>

                <div class="button-group" style="display: flex; gap: 10px;">
                <button type="submit" name="action" value="view">📊 View Expenses</button>
                <button type="submit" name="action" value="edit">✏️ Edit / 🗑️ Delete </button>
                </div>
            </form>
        </div>

</body>
</html>
