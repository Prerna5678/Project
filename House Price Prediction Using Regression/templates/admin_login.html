<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login – Jyesta</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --bg:      #0d1117;
    --surface: #161b22;
    --border:  #30363d;
    --accent:  #1E90FF;
    --accent2: #58a6ff;
    --red:     #f85149;
    --text:    #e6edf3;
    --muted:   #8b949e;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* ── TOP BAR ── */
.topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 30px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.topbar .brand { font-size: 18px; font-weight: 700; color: var(--accent2); }
.topbar .brand span { color: var(--text); }

/* ── CENTER CARD ── */
.center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}

.login-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 40px 42px;
    width: 420px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}

.login-card .icon {
    width: 56px;
    height: 56px;
    background: rgba(30,144,255,0.12);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    margin: 0 auto 20px;
}

.login-card h2 {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
}

.login-card .sub {
    text-align: center;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
}

/* Flash */
.flash {
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 18px;
    font-size: 13.5px;
    font-weight: 500;
}
.flash.error {
    background: rgba(248,81,73,0.1);
    border: 1px solid var(--red);
    color: var(--red);
}
.flash.success {
    background: rgba(63,185,80,0.1);
    border: 1px solid #3fb950;
    color: #3fb950;
}

/* Form */
.fg { margin-bottom: 18px; }
.fg label {
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 7px;
}
.fg input {
    width: 100%;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 11px 13px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.fg input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(30,144,255,0.18);
}

.login-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #1E90FF, #0A2A66);
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: 0.3px;
}
.login-btn:hover  { opacity: 0.9; }
.login-btn:active { transform: scale(0.99); }

.back-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
}
.back-link:hover { color: var(--accent2); }

/* ── FOOTER ── */
.foot {
    text-align: center;
    padding: 16px;
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
}

/* ================= TOAST ================= */
.toast {
    position: fixed; top: 24px; left: 50%;
    transform: translateX(-50%) translateY(-20px);
    border-radius: 10px; padding: 14px 24px 14px 18px;
    display: flex; align-items: center; gap: 12px;
    font-size: 15px; font-weight: 600; z-index: 9999;
    opacity: 0; transition: opacity 0.35s ease, transform 0.35s ease;
    min-width: 280px; max-width: 480px; pointer-events: none;
    border-left: 4px solid #1E90FF;
}
.toast.success { border-left-color: #3fb950; color: #3fb950; background: rgba(63,185,80,.08); border: 1px solid rgba(63,185,80,.3); border-left: 4px solid #3fb950; }
.toast.error   { border-left-color: #f85149; color: #f85149; background: rgba(248,81,73,.08); border: 1px solid rgba(248,81,73,.3); border-left: 4px solid #f85149; }
.toast.show    { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast-icon    { font-size: 20px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="topbar">
    <div class="brand">🏠 <span>Jyesta</span> Admin Panel</div>
</div>

<div class="center">
    <div class="login-card">
        <div class="icon">🔐</div>
        <h2>Admin Sign In</h2>
        <p class="sub">Enter your credentials to access the dashboard</p>

        <form method="POST">
            <div class="fg">
                <label>Username</label>
                <input type="text" name="username" placeholder="admin" required autofocus>
            </div>
            <div class="fg">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">🔓 Sign In to Dashboard</button>
        </form>

        <a href="{{ url_for('home') }}" class="back-link">← Back to main site</a>
    </div>
</div>



<div class="toast" id="toast">
    <span class="toast-icon" id="toast-icon"></span>
    <span id="toast-msg"></span>
</div>
<script>
function showToast(message, type) {
    const toast = document.getElementById('toast');
    toast.className = 'toast ' + type;
    document.getElementById('toast-icon').textContent = type === 'success' ? '✅' : '❌';
    document.getElementById('toast-msg').textContent  = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 4000);
}
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category, message in messages %}
window.addEventListener('DOMContentLoaded', () => showToast({{ message|tojson }}, {{ category|tojson }}));
{% endfor %}
{% endwith %}
</script>

</body>
</html>
