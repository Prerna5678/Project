<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<table>
    <tr>
        <th>Id</th>
        <th>Date</th>
        <th>Category</th>
        <th>Description</th>
        <th>(₹) Amount</th>
    </tr>
     {% for row in tracking %}
    <tr>
        <td>{{ row[0] }}</td>
        <td>{{ row[1] }}</td>
        <td>{{ row[2] }}</td>
        <td>{{ row[3] }}</td>
        <td>{{row[4]  }}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
