<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <style>
        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial;
        }

        .box {
            background: #1e1e1e;
            padding: 40px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 0 20px black;
        }

        h2 {
            text-align: center;
            color: #00adb5;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2c2c2c;
            border: none;
            border-radius: 5px;
            color: white;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #00adb5;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }

        button:hover {
            background: #008c94;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Admin Login</h2>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
