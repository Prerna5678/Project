<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body>
    <br><br><br>
    <div class="form-card">
    <form action="/login" method="POST">
        <h3>Create a New Account</h3><br>   
        <div class="form-group">
            <label for="username">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter Full Name" required>
        </div><br>
        <div class="form-group">
            <label for="contact">Phone No.</label>
            <input type="contact" id="contact" name="contact" placeholder="Enter Phone No. 10 digit only" required>
        </div><br>
        <div class="form-group">
            <label for="email">Email Id</label>
            <input type="email" id="email" name="email" placeholder="Enter Valid Email Id" required>
        </div><br>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter Password" required>
        </div><br>
        <div class="form-group">
            <label for="password">Confirm Password</label>
            <input type="c_password" id="c_password" name="password" placeholder="Enter Confirm Password" required>
        </div><br>
        <button type="submit">Login</button>
        <div>
    </form>
</body>
</html>
