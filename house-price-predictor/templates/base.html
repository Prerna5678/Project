<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}House Price Predictor{% endblock %}</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0b0f1a;
      --surface:   #131929;
      --surface2:  #1a2236;
      --border:    #232d42;
      --gold:      #c9a84c;
      --gold-lite: #e8c97a;
      --teal:      #2dd4bf;
      --text:      #e8ecf4;
      --muted:     #7a88a8;
      --success:   #22c55e;
      --danger:    #f43f5e;
      --radius:    14px;
      --shadow:    0 8px 40px rgba(0,0,0,.45);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 400;
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(11,15,26,.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px;
      height: 64px;
    }
    .nav-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: .3px;
      display: flex; align-items: center; gap: 10px;
    }
    .nav-brand .dot { width:8px; height:8px; border-radius:50%; background:var(--teal); display:inline-block; }
    .nav-links { display: flex; gap: 8px; align-items: center; }
    .nav-links a {
      color: var(--muted);
      text-decoration: none;
      font-size: .875rem;
      font-weight: 500;
      padding: 7px 16px;
      border-radius: 8px;
      transition: all .2s;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--text);
      background: var(--surface2);
    }
    .nav-cta {
      background: var(--gold) !important;
      color: #0b0f1a !important;
      font-weight: 600 !important;
    }
    .nav-cta:hover { background: var(--gold-lite) !important; }

    /* ── PAGE WRAPPER ── */
    .page { padding-top: 64px; min-height: 100vh; }

    /* ── HERO STRIP ── */
    .hero-strip {
      background: linear-gradient(135deg, var(--surface) 0%, #0f1e35 100%);
      border-bottom: 1px solid var(--border);
      padding: 56px 40px 48px;
      text-align: center;
      position: relative; overflow: hidden;
    }
    .hero-strip::before {
      content:'';
      position:absolute; inset:0;
      background: radial-gradient(ellipse 60% 80% at 50% 120%, rgba(201,168,76,.12) 0%, transparent 70%);
      pointer-events:none;
    }
    .hero-strip .eyebrow {
      font-size: .75rem; font-weight: 600; letter-spacing: 2.5px;
      color: var(--teal); text-transform: uppercase; margin-bottom: 12px;
    }
    .hero-strip h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 4vw, 3rem);
      color: var(--text); line-height: 1.15; margin-bottom: 14px;
    }
    .hero-strip h1 span { color: var(--gold); }
    .hero-strip p { color: var(--muted); font-size: 1rem; max-width: 520px; margin: 0 auto; }

    /* ── CONTAINER ── */
    .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .container-sm { max-width: 720px; margin: 0 auto; padding: 0 24px; }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* ── FORM ELEMENTS ── */
    .form-group { margin-bottom: 20px; }
    label {
      display: block; font-size: .8rem; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 7px;
    }
    input[type=number], select {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem;
      padding: 12px 16px;
      transition: border-color .2s, box-shadow .2s;
      appearance: none;
    }
    input[type=number]:focus, select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,.15);
    }
    select { cursor: pointer; }
    select option { background: var(--surface); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 13px 28px; border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: .95rem; font-weight: 600;
      cursor: pointer; border: none;
      text-decoration: none; transition: all .2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--gold), #a8792a);
      color: #0b0f1a; width: 100%;
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

    /* ── BADGE ── */
    .badge {
      display: inline-block; font-size: .72rem; font-weight: 600;
      padding: 3px 10px; border-radius: 20px; letter-spacing: .5px;
    }
    .badge-teal   { background: rgba(45,212,191,.12); color: var(--teal); }
    .badge-gold   { background: rgba(201,168,76,.12); color: var(--gold); }
    .badge-green  { background: rgba(34,197,94,.12); color: var(--success); }

    /* ── ALERT ── */
    .alert {
      padding: 12px 16px; border-radius: 10px; font-size: .88rem; margin-bottom: 20px;
    }
    .alert-danger { background: rgba(244,63,94,.1); border: 1px solid rgba(244,63,94,.3); color: #fda4af; }

    /* ── STATS ROW ── */
    .stats-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
      margin: 40px 0;
    }
    .stat-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 24px 20px; text-align: center;
    }
    .stat-box .num {
      font-family: 'Playfair Display', serif;
      font-size: 2rem; color: var(--gold); font-weight: 700;
    }
    .stat-box .lbl { font-size: .8rem; color: var(--muted); margin-top: 4px; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 28px 40px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: .8rem; color: var(--muted); margin-top: 60px;
    }
    footer a { color: var(--gold); text-decoration: none; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .fade-up { animation: fadeUp .5s ease both; }
    .fade-up-2 { animation: fadeUp .5s .1s ease both; }
    .fade-up-3 { animation: fadeUp .5s .2s ease both; }

    @media (max-width: 640px) {
      nav { padding: 0 16px; }
      .hero-strip { padding: 40px 16px 32px; }
      .stats-row { grid-template-columns: 1fr; }
      footer { flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body>

<nav>
  <a class="nav-brand" href="/">
    <span class="dot"></span> PropValuate
  </a>
  <div class="nav-links">
    <a href="/"       class="{{ 'active' if request.path == '/' }}">Predict</a>
    <a href="/history"class="{{ 'active' if request.path == '/history' }}">History</a>
    <a href="/about"  class="{{ 'active' if request.path == '/about' }}">Model Info</a>
    <a href="https://github.com" target="_blank" class="nav-cta btn">GitHub ↗</a>
  </div>
</nav>

<div class="page">
  {% block content %}{% endblock %}
</div>

<footer>
  <span>© 2024 PropValuate — House Price Prediction System</span>
  <span>Built with Flask · Scikit-learn · Random Forest</span>
</footer>

</body>
</html>
