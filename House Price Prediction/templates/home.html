<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HousePriceAI</title>

<style>
body {
    margin: 0;
    font-family: 'Roboto', Arial, sans-serif;
    background-color: #ECECEC;
}

/* Navigation */
nav {
    background-color: #0A2A66;
    padding: 15px 30px;
}

.nav-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 42px;
    height: 42px;
}

.logo span {
    color: #FFFFFF;
    font-size: 22px;
    font-weight: bold;
}

nav a {
    color: #FFFFFF;
    margin-left: 20px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
}

nav a:hover {
    color: #4DA3FF;
}

/* Main */
.main {
    display: flex;
    justify-content: center;
    padding: 50px 0;
}

.content {
    background: #FFFFFF;
    padding: 30px;
    border-radius: 15px;
    width: 90%;
    max-width: 900px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    border-left: 5px solid #1E90FF;
    text-align: center;
}

.content h2 {
    color: #0A2A66;
}

.content p {
    font-size: 17px;
    color: #333;
    line-height: 1.6;
    text-align: left;
}

/* Slider */
.slider {
    width: 100%;
    max-width: 800px;
    height: 400px;
    margin: 30px auto;
    overflow: hidden;
    border-radius: 12px;
    position: relative;
}

.slides {
    display: flex;
    transition: transform 0.5s ease-in-out;
}

.slide {
    min-width: 100%;
}

.slide img {
    width: 100%;
    height: 400px;
    object-fit: cover;
}

.prev, .next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: #FFFFFF;
    color: #0A2A66;
    border: none;
    font-size: 24px;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 50%;
}

.prev { left: 15px; }
.next { right: 15px; }

</style>
</head>

<body>

<!-- Navigation -->
<nav>
    <div class="nav-container">
        <div class="logo">
           <span>HousePriceAI</span>
        </div>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('how_it_works') }}">How It Works</a>
            <a href="{{ url_for('faq') }}">FAQ</a>
            <a href="{{ url_for('register') }}">Login</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </div>
</nav>

<!-- Main -->
<div class="main">
    <div class="content">
        <h2>Welcome to HousePriceAI</h2>

        <p>
        House Price Prediction using Regression estimates property prices 
        based on location, area, BHK, and bathrooms. It analyzes historical 
        data and predicts accurate prices using regression models.
        </p>

        <!-- Slider -->
        <div class="slider">
            <div class="slides" id="slides">
                <div class="slide">
                    <img src="{{ url_for('static', filename='images/house6.jpg') }}">
                </div>
                <div class="slide">
                    <img src="{{ url_for('static', filename='images/house1.jpg') }}">
                </div>
                <div class="slide">
                    <img src="{{ url_for('static', filename='images/house2.jpg') }}">
                </div>
            </div>

            <button class="prev" onclick="prevSlide()">&#10094;</button>
            <button class="next" onclick="nextSlide()">&#10095;</button>
        </div>
    </div>
</div>
<script>
let index = 0;
const slides = document.getElementById("slides");
const total = slides.children.length;

function autoSlide() {
    index = (index + 1) % total;
    slides.style.transform = "translateX(-" + (index * 100) + "%)";
}

setInterval(autoSlide, 3000);
</script>

</body>
</html>
