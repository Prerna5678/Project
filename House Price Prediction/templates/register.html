<!DOCTYPE html>
<html>
<head>
    <title>HousePriceAI</title>

<style>
body {
    margin: 0;
    font-family: 'Roboto', Arial, sans-serif;
    background-color: #ECECEC;
}

/* ================= NAVIGATION ================= */
nav {
    background-color: #0A2A66;
    padding: 15px 30px;
}

.nav-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 42px;
    height: 42px;
}

.logo span {
    color: #FFFFFF;
    font-size: 22px;
    font-weight: bold;
}

nav a {
    color: #FFFFFF;
    margin-left: 20px;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
}

nav a:hover {
    color: #4DA3FF;
}

/* ================= SIGNUP FORM ================= */
.signup-section {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 60px 20px;
}

.form-container {
    width: 400px;
    background: #FFFFFF;
    padding: 35px;
    border-radius: 12px;
    box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.15),
        0 4px 10px rgba(30, 144, 255, 0.15);
    border-top: 5px solid #1E90FF;
}

.form-container h2 {
    text-align: center;
    color: #0A2A66;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    font-weight: bold;
    display: block;
    margin-bottom: 6px;
}

.form-group input {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    font-size: 14px;
    transition: border 0.3s ease;
}

.form-group input:focus {
    border: 1px solid #1E90FF;
    outline: none;
}

.signup-btn {
    width: 100%;
    padding: 12px;
    background-color: #1E90FF;
    color: #FFFFFF;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s ease;
}

.signup-btn:hover {
    background-color: #166FCC;
}

.form-footer {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.form-footer a {
    color: #1E90FF;
    text-decoration: none;
    font-weight: bold;
}

.form-footer a:hover {
    text-decoration: underline;
}

</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<nav>
    <div class="nav-container">
        <div class="logo">
            <span>HousePriceAI</span>
        </div>
        <div>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('how_it_works') }}">How It Works</a>
            <a href="{{ url_for('faq') }}">FAQ</a>
            <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>
</nav>

<!-- ================= SIGNUP FORM ================= -->
<section class="signup-section">
    <div class="form-container">
        <h2>Create Account</h2>

        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="name" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" required>
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
        </form>

        <div class="form-footer">
            Already have an account?
            <a href="{{ url_for('login') }}">Sign In</a>
        </div>
    </div>
</section>


</body>
</html>
